# ka9q-radio configuration for RX888 with dynamic channel support
# For use with UberSDR
#
# UNITS: blocktime is in SECONDS on current ka9q-radio.  It used to be
# milliseconds, so a legacy config saying "blocktime = 20" now means 20 SECONDS
# and asks for an absurd FFT block.  The entrypoint rewrites any legacy value
# automatically on start; see entrypoint/start-radiod.sh.

[global]
hardware = rx888
description = RX888-HF
status = hf-status.local
data = pcm.local
ttl = 1
mode = usb
samprate = 12000
blocktime = 0.02          # seconds (20 ms)
overlap = 5
fft-threads = 1

[rx888]
device = rx888
samprate = 64800000
description = RX888-HF
#gainmode = high          # AD8370 VGA gain mode
#gain = 10                # AD8370 VGA gain, -25..+17 dB (low gain) or -8..+34 dB (high gain)
#att = 0.0                # PE4312 attenuator in dB (0-31.5 in 0.5 dB steps)

# Si5351 reference frequency in Hz.  This replaces the old "calibrate" key, which
# the rx888 driver no longer has: instead of a fractional error you give the true
# measured reference frequency.  27 MHz nominal, so a clock running +1 ppm fast is
# 27000027.  UberSDR's admin auto-calibration writes this value.
reference = 27000000

# Capture-time patch (patches/0003): the RX888's own latency between the antenna
# and the USB callback (A/D pipeline, FX3 buffering, the last USB packet in
# flight), taken off the capture times radiod publishes to UberSDR.  Seconds,
# either sign (positive moves capture times earlier), clamped to +/-1 s; 0 when
# unset.  Measure it per host from ubersdr-ntp's Difference (radio - ntp) once it
# has settled over hours: a steady -L ms means capture-latency = L / 1000.  The
# value below is an example from one host, which read -0.30 ms over 12.9 h; check
# after setting it that the Difference settles near 0 (near twice the old value
# instead means the sign is the wrong way round).
#capture-latency = 0.0003
